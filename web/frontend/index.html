<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Ensures that the UI is properly scaled in the Shopify Mobile app -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script type="module">
      if (!import.meta.env || !import.meta.env.PROD) {
        // Because the base HTML is rendered in the server side, we need to manually embed the code to enable HMR in our
        // code, so that the vite server is properly enabled to run HMR
        const script = document.createElement('script');
        script.setAttribute('type', "module");
        script.setAttribute('src', "./dev_embed.js");
        document.getElementsByTagName('head')[0].append(script);
      }
    </script>

    <meta name="shopify-api-key" content="%VITE_SHOPIFY_API_KEY%" />
    <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
    <style>
      /* Polaris's UnstyledButton keeps the browser's button look (grey box in Safari); strip it so the badge is the button. */
      .badge-button { appearance: none; background: none; border: 0; padding: 0; cursor: pointer; border-radius: var(--p-border-radius-full); }
      .badge-button:hover { filter: brightness(0.88); } /* deepens any badge colour, no per-colour rules */
      /* Polaris 10 has one critical badge colour; out of stock gets its strong red so it stands apart from critical. */
      .badge-strong .Polaris-Badge { background-color: var(--p-color-bg-critical-strong); color: var(--p-color-text-on-color); }
      .badge-button:focus-visible { outline: 2px solid var(--p-focused); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div id="app"><!--index.jsx injects App.jsx here--></div>
    <script type="module" src="/index.jsx"></script>
  </body>
</html>
